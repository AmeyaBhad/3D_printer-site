spring.application.name=backend

# Listen on $PORT if provided (Render, Heroku, Fly etc.), otherwise 8080 locally.
server.port=${PORT:8080}

# --- Database -----------------------------------------------------------------
# Default: local H2 file-based DB. Override SPRING_DATASOURCE_URL/USERNAME/PASSWORD
# in your deploy env to switch to Postgres (Hibernate auto-detects the dialect
# and driver from the JDBC URL).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/forgedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# H2 console only useful when the H2 driver is loaded. Restricted to ADMIN role
# in SecurityConfig anyway, so safe to leave enabled.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.forge3d.backend=DEBUG

# JWT
# Override this with the JWT_SECRET env var in any non-local environment.
jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-this-must-be-at-least-32-bytes-long-for-hs256}
jwt.expiration-ms=86400000

# Google Sign-In
# Set GOOGLE_CLIENT_ID env var (or replace the empty default) with the OAuth Client ID
# from Google Cloud Console > Credentials. Required for "Sign in with Google" to work.
# Leave blank to skip audience checking (accepts any Google token — fine for local testing only).
google.client-id=${GOOGLE_CLIENT_ID:}

# CORS
# Comma-separated list of origins allowed to call the API. Set CORS_ALLOWED_ORIGINS
# in production to your Vercel URL, e.g. "https://my-app.vercel.app".
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Razorpay
# Get test-mode keys from https://dashboard.razorpay.com/app/keys (test mode = no real money).
# RAZORPAY_KEY_ID looks like "rzp_test_xxxxxxxxxxxx".
# Leave blank to disable the payment endpoints (frontend will then fall back to direct order placement).
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
