spring.application.name=backend
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/forgedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console for H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.forge3d.backend=DEBUG

# JWT
# Override this with the JWT_SECRET env var in any non-local environment.
jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-this-must-be-at-least-32-bytes-long-for-hs256}
jwt.expiration-ms=86400000

# Google Sign-In
# Set GOOGLE_CLIENT_ID env var (or replace the empty default) with the OAuth Client ID
# from Google Cloud Console > Credentials. Required for "Sign in with Google" to work.
# Leave blank to skip audience checking (accepts any Google token — fine for local testing only).
google.client-id=${GOOGLE_CLIENT_ID:}
